name: SaràFatto CI and IONOS preview (publication locked)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA autorizzato (deve coincidere con il commit selezionato su main)
        required: true
        type: string
      run_remote_dry_run:
        description: Avvia anche il confronto SSH e rsync --dry-run (richiede i Secrets IONOS)
        required: true
        default: false
        type: boolean
      run_remote_state_inspection:
        description: Ispezione read-only di baseline, current-release e filesystem IONOS (richiede i Secrets SSH)
        required: true
        default: false
        type: boolean
      stage_private_artifact:
        description: Trasferisce e verifica l'artefatto soltanto nell'area privata IONOS (richiede Environment protetto)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ionos-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout commit selezionato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Controlla sintassi Bash
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/deploy/remote-inventory.sh scripts/deploy/compare-remote.sh scripts/deploy/test-preview-fixtures.sh scripts/deploy/init-private-environment.sh scripts/deploy/baseline-inventory.sh scripts/deploy/test-baseline-inventory-fixture.sh; do
            bash -n "$script"
          done
      - name: Controlla sintassi YAML del workflow
        shell: bash
        run: ruby -e 'require "psych"; Psych.parse_file(".github/workflows/deploy-ionos.yml"); puts "Sintassi YAML valida."'
      - name: Controlla sintassi JavaScript
        shell: bash
        run: node --check scripts/deploy/verify-vite-manifest.mjs
      - name: Controlla sintassi Python e fixture inventario
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding="utf-8")) for p in ("scripts/deploy/preview-report.py", "scripts/deploy/baseline_tool.py", "scripts/deploy/test_baseline_tool.py", "scripts/deploy/backup_tool.py", "scripts/deploy/test_backup_tool.py", "scripts/deploy/release_state_tool.py", "scripts/deploy/test_release_state_tool.py", "scripts/deploy/transaction_fixture_tool.py", "scripts/deploy/test_transaction_fixture_tool.py", "scripts/deploy/production_adapter.py", "scripts/deploy/test_production_adapter.py", "scripts/deploy/production_publisher.py", "scripts/deploy/test_production_publisher.py", "scripts/deploy/artifact_transfer_tool.py", "scripts/deploy/test_artifact_transfer_tool.py", "scripts/deploy/ionos_release_barrier_probe.py", "scripts/deploy/test_ionos_release_barrier_probe.py", "scripts/deploy/http_php_release_probe.py", "scripts/deploy/test_http_php_release_probe.py", "scripts/deploy/request_barrier_tool.py", "scripts/deploy/test_request_barrier_tool.py", "scripts/deploy/mu_plugin_migration_tool.py", "scripts/deploy/test_mu_plugin_migration_tool.py", "scripts/deploy/mu_plugin_transaction_fixture_tool.py", "scripts/deploy/test_mu_plugin_transaction_fixture_tool.py")]'
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_baseline_tool.py
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_backup_tool.py
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_release_state_tool.py
          SARAFATTO_REQUIRE_POSIX=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_application_release_state.py
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_transaction_fixture_tool.py
          SARAFATTO_REQUIRE_POSIX=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_production_adapter.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_production_publisher.py
          SARAFATTO_REQUIRE_POSIX=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_artifact_transfer_tool.py
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_http_php_release_probe.py
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_ionos_release_barrier_probe.py
          SARAFATTO_REQUIRE_FLOCK=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_request_barrier_tool.py
          SARAFATTO_REQUIRE_POSIX=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_mu_plugin_migration_tool.py
          SARAFATTO_REQUIRE_FLOCK=1 SARAFATTO_REQUIRE_POSIX=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/test_mu_plugin_transaction_fixture_tool.py
          bash scripts/deploy/test-preview-fixtures.sh
          bash scripts/deploy/test-baseline-inventory-fixture.sh

  build-artifact:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Verifica branch e SHA autorizzato
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'Il workflow è consentito solo da main.' >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Inserire uno SHA completo valido.' >&2; exit 1; }
          [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]] || { echo 'Lo SHA inserito non coincide con il commit autorizzato del dispatch.' >&2; exit 1; }
      - name: Checkout commit autorizzato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: themes/sarafatto/package-lock.json
      - name: Crea pacchetto pulito del commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          package="$RUNNER_TEMP/sarafatto-release"
          mkdir -p "$package"
          git archive "$GITHUB_SHA" themes/sarafatto plugins/sarafatto-core mu-plugins/sarafatto-polylang-front-page-url.php | tar -x -C "$package"
          echo "PACKAGE_DIR=$package" >> "$GITHUB_ENV"
      - name: Build Vite
        working-directory: themes/sarafatto
        run: |
          npm ci
          npm run build
      - name: Inserisce la build e verifica il manifest
        shell: bash
        run: |
          set -euo pipefail
          dist="$PACKAGE_DIR/themes/sarafatto/assets/dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp -a themes/sarafatto/assets/dist/. "$dist/"
          node scripts/deploy/verify-vite-manifest.mjs --package "$PACKAGE_DIR" --inventory "$RUNNER_TEMP/sarafatto-inventory.tsv" --release-sha "$GITHUB_SHA"
      - name: Crea archivio immutabile e provenance del run
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sarafatto-release.tar.gz"
          provenance="$RUNNER_TEMP/sarafatto-provenance.json"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RUNNER_TEMP" sarafatto-release sarafatto-inventory.tsv | gzip -n > "$archive"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/production_publisher.py create-provenance \
            --release-sha "$GITHUB_SHA" --ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" \
            --inventory "$RUNNER_TEMP/sarafatto-inventory.tsv" --archive "$archive" --output "$provenance"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/production_publisher.py verify-artifact \
            --release-sha "$GITHUB_SHA" --package "$PACKAGE_DIR" \
            --inventory "$RUNNER_TEMP/sarafatto-inventory.tsv" --provenance "$provenance" \
            --archive "$archive" --run-id "$GITHUB_RUN_ID"
      - name: Prepara toolchain privata revisionabile senza installarla
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          sys.path.insert(0, 'scripts/deploy')
          import artifact_transfer_tool
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sarafatto-toolchain'
          target = root / 'scripts/deploy'
          target.mkdir(parents=True, mode=0o700)
          report = artifact_transfer_tool.toolchain_contract()
          for row in report['contract']['files']:
              source = pathlib.Path('scripts/deploy') / row['file']
              payload = source.read_bytes()
              if hashlib.sha256(payload).hexdigest() != row['sha256']:
                  raise SystemExit('Toolchain cambiata durante il packaging')
              destination = target / row['file']
              shutil.copyfile(source, destination)
              destination.chmod(0o600)
          (root / 'TOOLCHAIN.json').write_text(json.dumps(report, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          (root / 'SHA256SUMS').write_text(''.join(row['sha256']+'  scripts/deploy/'+row['file']+'\n' for row in report['contract']['files']), encoding='utf-8')
          PY
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RUNNER_TEMP/sarafatto-toolchain" scripts TOOLCHAIN.json SHA256SUMS | gzip -n > "$RUNNER_TEMP/sarafatto-toolchain.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum sarafatto-toolchain.tar.gz > sarafatto-toolchain.tar.gz.sha256)
      - name: Conserva toolchain e contratto autorizzabili separatamente
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarafatto-toolchain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sarafatto-toolchain.tar.gz
            ${{ runner.temp }}/sarafatto-toolchain.tar.gz.sha256
            ${{ runner.temp }}/sarafatto-toolchain/TOOLCHAIN.json
            ${{ runner.temp }}/sarafatto-toolchain/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Carica artefatto di sola anteprima
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarafatto-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sarafatto-release/**
            ${{ runner.temp }}/sarafatto-inventory.tsv
            ${{ runner.temp }}/sarafatto-release.tar.gz
            ${{ runner.temp }}/sarafatto-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  remote-dry-run:
    needs: [validate, build-artifact]
    if: github.event_name == 'workflow_dispatch' && inputs.run_remote_dry_run == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout strumenti di confronto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          persist-credentials: false
      - name: Scarica artefatto verificato
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarafatto-release-${{ github.sha }}
          path: ${{ runner.temp }}/sarafatto-artifact
      - name: Ricontrolla l'artefatto scaricato
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/verify-vite-manifest.mjs \
            --package "$RUNNER_TEMP/sarafatto-artifact/sarafatto-release" \
            --inventory "$RUNNER_TEMP/sarafatto-artifact/reverified-inventory.tsv" \
            --release-sha "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/sarafatto-artifact/sarafatto-inventory.tsv" \
              "$RUNNER_TEMP/sarafatto-artifact/reverified-inventory.tsv"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/production_publisher.py verify-artifact \
            --release-sha "$GITHUB_SHA" \
            --package "$RUNNER_TEMP/sarafatto-artifact/sarafatto-release" \
            --inventory "$RUNNER_TEMP/sarafatto-artifact/sarafatto-inventory.tsv" \
            --provenance "$RUNNER_TEMP/sarafatto-artifact/sarafatto-provenance.json" \
            --archive "$RUNNER_TEMP/sarafatto-artifact/sarafatto-release.tar.gz" \
            --run-id "$GITHUB_RUN_ID"
      - name: Installa credenziali SSH effimere
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/sarafatto-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/sarafatto-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/sarafatto-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/sarafatto-ssh/id_ed25519" "$RUNNER_TEMP/sarafatto-ssh/known_hosts"
      - name: Confronto remoto e rsync dry-run
        env:
          IONOS_SSH_HOST: ${{ vars.IONOS_SSH_HOST }}
          IONOS_SSH_USER: ${{ vars.IONOS_SSH_USER }}
          IONOS_SSH_PORT: ${{ vars.IONOS_SSH_PORT }}
          RELEASE_SHA: ${{ github.sha }}
          PACKAGE_DIR: ${{ runner.temp }}/sarafatto-artifact/sarafatto-release
          LOCAL_INVENTORY: ${{ runner.temp }}/sarafatto-artifact/sarafatto-inventory.tsv
          SSH_KEY_FILE: ${{ runner.temp }}/sarafatto-ssh/id_ed25519
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/sarafatto-ssh/known_hosts
        shell: bash
        run: bash scripts/deploy/compare-remote.sh

  remote-state-inspection:
    needs: [validate, build-artifact]
    if: github.event_name == 'workflow_dispatch' && inputs.run_remote_state_inspection == true
    runs-on: ubuntu-24.04
    steps:
      - name: Verifica branch e SHA autorizzato
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "L'ispezione è consentita solo da main." >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_SHA" == "$GITHUB_SHA" ]] || { echo 'SHA autorizzato non valido o diverso dal dispatch.' >&2; exit 1; }
      - name: Checkout strumenti autorizzati per ispezione privata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Identifica toolchain autorizzata dalla CI
        id: inspection_toolchain
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/artifact_transfer_tool.py toolchain > "$RUNNER_TEMP/sarafatto-inspection-toolchain.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); [print("{}  /home/www/sarafatto-deploy/tools/scripts/deploy/{}".format(f["sha256"],f["file"])) for f in r["contract"]["files"]]' "$RUNNER_TEMP/sarafatto-inspection-toolchain.json" > "$RUNNER_TEMP/sarafatto-inspection-toolchain.sha256"
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["toolchain_sha256"])' "$RUNNER_TEMP/sarafatto-inspection-toolchain.json")"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Installa credenziali SSH effimere
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/sarafatto-state-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/sarafatto-state-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/sarafatto-state-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/sarafatto-state-ssh/id_ed25519" "$RUNNER_TEMP/sarafatto-state-ssh/known_hosts"
      - name: Ispezione remota read-only
        env:
          IONOS_SSH_HOST: ${{ vars.IONOS_SSH_HOST }}
          IONOS_SSH_USER: ${{ vars.IONOS_SSH_USER }}
          IONOS_SSH_PORT: ${{ vars.IONOS_SSH_PORT }}
          TOOLCHAIN_SHA256: ${{ steps.inspection_toolchain.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IONOS_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$IONOS_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$IONOS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( IONOS_SSH_PORT >= 1 && IONOS_SSH_PORT <= 65535 ))
          ssh -T -p "$IONOS_SSH_PORT" \
            -i "$RUNNER_TEMP/sarafatto-state-ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/sarafatto-state-ssh/known_hosts" -o ConnectTimeout=15 \
            "$IONOS_SSH_USER@$IONOS_SSH_HOST" \
            "sha256sum --strict -c -" < "$RUNNER_TEMP/sarafatto-inspection-toolchain.sha256"
          ssh -T -p "$IONOS_SSH_PORT" \
            -i "$RUNNER_TEMP/sarafatto-state-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/sarafatto-state-ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$IONOS_SSH_USER@$IONOS_SSH_HOST" \
            "PYTHONDONTWRITEBYTECODE=1 python3 /home/www/sarafatto-deploy/tools/scripts/deploy/production_adapter.py inspect --toolchain-sha256 '$TOOLCHAIN_SHA256'"

  stage-private-artifact:
    needs: [validate, build-artifact]
    if: github.event_name == 'workflow_dispatch' && inputs.stage_private_artifact == true && vars.IONOS_PRIVATE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ionos-private-staging
    steps:
      - name: Verifica branch e SHA esatto
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_SHA" == "$GITHUB_SHA" ]]
      - name: Checkout strumenti del commit autorizzato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Scarica artifact dello stesso run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarafatto-release-${{ github.sha }}
          path: ${{ runner.temp }}/sarafatto-transfer
      - name: Verifica package, archivio e provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/verify-vite-manifest.mjs \
            --package "$RUNNER_TEMP/sarafatto-transfer/sarafatto-release" \
            --inventory "$RUNNER_TEMP/sarafatto-transfer/reverified-inventory.tsv" \
            --release-sha "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/sarafatto-transfer/sarafatto-inventory.tsv" \
              "$RUNNER_TEMP/sarafatto-transfer/reverified-inventory.tsv"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/production_publisher.py verify-artifact \
            --release-sha "$GITHUB_SHA" \
            --package "$RUNNER_TEMP/sarafatto-transfer/sarafatto-release" \
            --inventory "$RUNNER_TEMP/sarafatto-transfer/sarafatto-inventory.tsv" \
            --provenance "$RUNNER_TEMP/sarafatto-transfer/sarafatto-provenance.json" \
            --archive "$RUNNER_TEMP/sarafatto-transfer/sarafatto-release.tar.gz" \
            --run-id "$GITHUB_RUN_ID"
      - name: Installa credenziali SSH effimere
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/sarafatto-transfer-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/sarafatto-transfer-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/sarafatto-transfer-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/sarafatto-transfer-ssh/id_ed25519" "$RUNNER_TEMP/sarafatto-transfer-ssh/known_hosts"
      - name: Identifica gli strumenti compatibili senza vincolo al checkout IONOS
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/deploy/artifact_transfer_tool.py toolchain > "$RUNNER_TEMP/sarafatto-toolchain.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); [print("{}  /home/www/sarafatto-deploy/tools/scripts/deploy/{}".format(f["sha256"],f["file"])) for f in r["contract"]["files"]]' "$RUNNER_TEMP/sarafatto-toolchain.json" > "$RUNNER_TEMP/sarafatto-toolchain.sha256"
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["toolchain_sha256"])' "$RUNNER_TEMP/sarafatto-toolchain.json")"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Verifica strumenti e prenota una directory privata non riutilizzabile
        id: reserve
        env:
          IONOS_SSH_HOST: ${{ vars.IONOS_SSH_HOST }}
          IONOS_SSH_USER: ${{ vars.IONOS_SSH_USER }}
          IONOS_SSH_PORT: ${{ vars.IONOS_SSH_PORT }}
          SSH_KEY_FILE: ${{ runner.temp }}/sarafatto-transfer-ssh/id_ed25519
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/sarafatto-transfer-ssh/known_hosts
          TOOLCHAIN_SHA256: ${{ steps.toolchain.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IONOS_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$IONOS_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$IONOS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( IONOS_SSH_PORT >= 1 && IONOS_SSH_PORT <= 65535 ))
          transfer_id="run-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/sarafatto-transfer/sarafatto-release.tar.gz" | cut -d ' ' -f 1)"
          inventory_sha256="$(sha256sum "$RUNNER_TEMP/sarafatto-transfer/sarafatto-inventory.tsv" | cut -d ' ' -f 1)"
          provenance_sha256="$(sha256sum "$RUNNER_TEMP/sarafatto-transfer/sarafatto-provenance.json" | cut -d ' ' -f 1)"
          ssh -T -p "$IONOS_SSH_PORT" -i "$SSH_KEY_FILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o ConnectTimeout=15 \
            "$IONOS_SSH_USER@$IONOS_SSH_HOST" \
            "sha256sum --strict -c -" < "$RUNNER_TEMP/sarafatto-toolchain.sha256"
          ssh -T -p "$IONOS_SSH_PORT" -i "$SSH_KEY_FILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o ConnectTimeout=15 \
            "$IONOS_SSH_USER@$IONOS_SSH_HOST" \
            "PYTHONDONTWRITEBYTECODE=1 python3 /home/www/sarafatto-deploy/tools/scripts/deploy/artifact_transfer_tool.py toolchain --expected-toolchain-sha256 '$TOOLCHAIN_SHA256' && PYTHONDONTWRITEBYTECODE=1 python3 /home/www/sarafatto-deploy/tools/scripts/deploy/artifact_transfer_tool.py reserve --transfer-id '$transfer_id' --release-sha '$GITHUB_SHA' --run-id '$GITHUB_RUN_ID' --archive-sha256 '$archive_sha256' --inventory-sha256 '$inventory_sha256' --provenance-sha256 '$provenance_sha256' --toolchain-sha256 '$TOOLCHAIN_SHA256'"
          echo "transfer_id=$transfer_id" >> "$GITHUB_OUTPUT"
          echo "remote_dir=/home/www/sarafatto-deploy/staging/incoming/$transfer_id" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
      - name: Trasferisce soltanto nell'area privata prenotata
        env:
          IONOS_SSH_HOST: ${{ vars.IONOS_SSH_HOST }}
          IONOS_SSH_USER: ${{ vars.IONOS_SSH_USER }}
          IONOS_SSH_PORT: ${{ vars.IONOS_SSH_PORT }}
          SSH_KEY_FILE: ${{ runner.temp }}/sarafatto-transfer-ssh/id_ed25519
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/sarafatto-transfer-ssh/known_hosts
          TRANSFER_ID: ${{ steps.reserve.outputs.transfer_id }}
          TOOLCHAIN_SHA256: ${{ steps.toolchain.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in sarafatto-release.tar.gz sarafatto-inventory.tsv sarafatto-provenance.json; do
            ssh -T -p "$IONOS_SSH_PORT" -i "$SSH_KEY_FILE" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o ConnectTimeout=15 \
              "$IONOS_SSH_USER@$IONOS_SSH_HOST" \
              "PYTHONDONTWRITEBYTECODE=1 python3 /home/www/sarafatto-deploy/tools/scripts/deploy/artifact_transfer_tool.py receive --transfer-id '$TRANSFER_ID' --release-sha '$GITHUB_SHA' --run-id '$GITHUB_RUN_ID' --toolchain-sha256 '$TOOLCHAIN_SHA256' --name '$name'" \
              < "$RUNNER_TEMP/sarafatto-transfer/$name"
          done
      - name: Verifica sul server e chiude il trasferimento privato
        env:
          IONOS_SSH_HOST: ${{ vars.IONOS_SSH_HOST }}
          IONOS_SSH_USER: ${{ vars.IONOS_SSH_USER }}
          IONOS_SSH_PORT: ${{ vars.IONOS_SSH_PORT }}
          SSH_KEY_FILE: ${{ runner.temp }}/sarafatto-transfer-ssh/id_ed25519
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/sarafatto-transfer-ssh/known_hosts
          TRANSFER_ID: ${{ steps.reserve.outputs.transfer_id }}
          TOOLCHAIN_SHA256: ${{ steps.toolchain.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -p "$IONOS_SSH_PORT" -i "$SSH_KEY_FILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" -o ConnectTimeout=15 \
            "$IONOS_SSH_USER@$IONOS_SSH_HOST" \
            "PYTHONDONTWRITEBYTECODE=1 python3 /home/www/sarafatto-deploy/tools/scripts/deploy/artifact_transfer_tool.py publisher-inputs --transfer-id '$TRANSFER_ID' --release-sha '$GITHUB_SHA' --run-id '$GITHUB_RUN_ID' --toolchain-sha256 '$TOOLCHAIN_SHA256'" \
            | tee "$RUNNER_TEMP/sarafatto-transfer-report.json"
          python3 -c 'import json,os,sys; r=json.load(open(os.environ["RUNNER_TEMP"]+"/sarafatto-transfer-report.json")); ok=r["status"] == "verified-private-artifact" and r["public_writes_performed"] is False and r["release_sha"] == os.environ["GITHUB_SHA"] and r["run_id"] == os.environ["GITHUB_RUN_ID"] and r["toolchain_sha256"] == os.environ["TOOLCHAIN_SHA256"]; sys.exit(0 if ok else "Report trasferimento non corrispondente al run autorizzato")'
      - name: Conserva report di compatibilità e trasferimento
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarafatto-private-transfer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sarafatto-toolchain.json
            ${{ runner.temp }}/sarafatto-transfer-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Riepilogo e rimozione credenziali effimere
        if: always()
        env:
          TRANSFER_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## Trasferimento privato SaràFatto\n\nEsito job: %s. Nessuna pubblicazione WordPress eseguita.\n' "$TRANSFER_RESULT" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/sarafatto-transfer-ssh/id_ed25519" "$RUNNER_TEMP/sarafatto-transfer-ssh/known_hosts"
